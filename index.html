<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/gem-org-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gem System</title>
    <script>
      try {
        var theme = localStorage.getItem("gem-docs-theme");
        if (theme === "light" || theme === "dark")
          document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    </script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
